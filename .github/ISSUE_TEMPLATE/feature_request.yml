name: Feature request
description: Suggest an idea for dsh-update-all
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project! Tell us what problem you want
        solved, not only the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Feel free to sketch CLI flags or output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you already use?
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions
          required: true
