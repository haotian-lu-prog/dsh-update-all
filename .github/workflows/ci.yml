name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show tool versions
        run: |
          bash --version | head -1
          node --version
          npm --version

      - name: Bash syntax check
        run: |
          bash -n dsh-update-all.sh
          bash -n install.sh
          bash -n tests/run-tests.sh

      - name: Run test suite
        run: bash tests/run-tests.sh

      - name: Run test suite with system bash (macOS 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/run-tests.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck dsh-update-all.sh install.sh tests/run-tests.sh

  release-check:
    name: Release check (tagged builds)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify tag matches script version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          script_version="$(bash dsh-update-all.sh --version | awk '{print $2}')"
          if [ "$tag" != "$script_version" ]; then
            echo "tag v${tag} does not match UPDATER_VERSION ${script_version}" >&2
            exit 1
          fi
