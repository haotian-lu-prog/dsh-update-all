name: Publish plugin

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish dsh-update-plugin to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag against plugin version
        run: |
          version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('plugin/package.json','utf8')).version)")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#plugin-v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag plugin-v${tag} does not match plugin/package.json ${version}"
              exit 1
            fi
          fi
          echo "publishing dsh-update-plugin ${version}"

      - name: Check whether this version is already on npm
        id: check
        run: |
          version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('plugin/package.json','utf8')).version)")"
          if npm view "dsh-update-plugin@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "dsh-update-plugin@${version} is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set; add it in the repository settings"
            exit 1
          fi
          npm publish --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#plugin-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" \
            --title "dsh-update-plugin v${version}" \
            --generate-notes
