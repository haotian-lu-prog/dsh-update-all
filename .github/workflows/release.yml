name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    name: Attach shell scripts to the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dsh-update-all.sh install.sh --clobber
