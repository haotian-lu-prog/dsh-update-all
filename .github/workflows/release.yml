name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag against UPDATER_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          script_version="$(bash dsh-update-all.sh --version | awk '{print $2}')"
          if [ "$tag" != "$script_version" ]; then
            echo "::error::tag v${tag} does not match UPDATER_VERSION ${script_version}"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dsh-update-all.sh install.sh --clobber

      - name: Trigger Homebrew tap update (optional)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; homebrew-tap updates on its own daily schedule."
            exit 0
          fi
          gh workflow run update-formula.yml \
            --repo haotian-lu-prog/homebrew-tap || \
            echo "::warning::could not trigger homebrew-tap, it will update on its next schedule"
